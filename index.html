<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Todo List</title><link rel=icon href=data:,><script defer src=main.js></script></head><body><div class=layout><aside class=sidebar><h1 class=app-title>Todo List</h1><ul id=project-list class=project-list></ul><form id=new-project-form class=inline-form><input id=new-project-name placeholder="New project" aria-label="New project name" autocomplete=off required> <button type=submit>Add</button></form></aside><main class=main><header class=project-header><input id=project-name class=project-name aria-label="Project name" autocomplete=off> <button id=delete-project type=button class=button-danger>Delete project</button></header><p id=error class=error role=alert hidden><form id=new-todo-form class=new-todo-form><input id=new-todo-title placeholder="What needs doing?" aria-label="Todo title" autocomplete=off required> <input id=new-todo-due-date type=date aria-label="Due date"> <select id=new-todo-priority aria-label=Priority><option value=low>Low<option value=medium>Medium<option value=high>High</select> <button type=submit class=button-primary>Add todo</button></form><ul id=todo-list class=todo-list></ul><p id=empty-message class=empty-state hidden>No todos here yet. Add one above.</main></div><template id=todo-template><li class=todo><div class=todo-row><div class=todo-main><input type=checkbox class=todo-done aria-label=Done> <input class=todo-title aria-label=Title autocomplete=off></div><div class=todo-meta><select class=todo-priority aria-label=Priority><option value=low>Low<option value=medium>Medium<option value=high>High</select> <input type=date class=todo-due-date aria-label="Due date"> <button type=button class=todo-delete aria-label="Delete todo">×</button></div></div><span class=todo-due-label></span><details class=todo-details><summary>Notes</summary><textarea class=todo-notes aria-label=Notes placeholder="Add notes…" rows=3></textarea></details></template></body></html>
